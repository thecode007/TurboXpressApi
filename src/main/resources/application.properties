# Server Configuration
server.port=3001

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/turboxpress_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=VARCHAR

# Jackson Configuration
# spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# SQL Initialization
# Set to 'always' only when you need to recreate the schema from scratch
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# JWT Configuration
jwt.secret=your-secret-key-change-this-in-production-make-it-at-least-256-bits-long
jwt.expiration=86400000
jwt.impersonation.expiration=3600000

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload.dir=uploads/profiles

# Logging
logging.level.com.turboxpress.identity=DEBUG
logging.level.org.springframework.security=DEBUG


# Hikari
spring.datasource.hikari.leak-detection-threshold=20000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.minimum-idle=5

spring.jpa.open-in-view=false
